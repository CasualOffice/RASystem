[package]
name = "ras-media-scap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Cross-platform CPU screen capture behind `ras-media::ScreenCaptureBackend`, used by the Linux
# (PipeWire/portal) and Windows (WGC) sharing paths (ADR-063). Wraps the permissive `scap` crate,
# which selects PipeWire on Linux, Windows.Graphics.Capture on Windows, and ScreenCaptureKit on
# macOS. Frames are CPU BGRA, handed to the OpenH264 software encoder via SurfaceKind::CpuBgra.
# macOS production still uses the zero-copy ras-media-macos backend; scap builds here only so the
# adapter is locally compile-checked.

[dependencies]
ras-media = { path = "../ras-media" }
ras-protocol = { path = "../ras-protocol" }
log = "0.4"

# scap covers linux/windows/macos; on any other target this crate is empty (keeps builds green).
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
scap = "0.0.8"

# Windows-only version pin (not used directly). scap 0.0.8 declares `windows-capture ^1.3.6`, but
# windows-capture 1.5.0 added three required args to `Settings::new` (5→8) in a *minor* release,
# which fails to compile against scap's 5-arg call. Cap it at the last 5-arg version so a future
# `cargo update` can't silently re-break the Windows build. Revisit when scap bumps to a 1.5+ API.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"
# `GetMonitorInfoW` (position + pixel rect) and `GetDpiForMonitor` (HiDPI scale) for
# `enumerate_displays()` (ADR-081) — scap's own `Target::Display` carries only an opaque `HMONITOR` +
# device name (no geometry), and its internal `get_scale_factor`/`get_target_dimensions` helpers that
# *do* compute geometry are private to that crate, so this reimplements the same GDI calls directly.
# Same major version `ras-input-windows` already pins (0.58, already resolved via scap's own
# `windows-capture` chain).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

# Linux has no `enumerate_displays()` implementation here (the trait default — empty — is used): scap
# reports zero targets on Linux at all (confirmed by reading scap's source), because the
# xdg-desktop-portal picks interactively when the capturer starts, not programmatically. There is no
# API to ask for real monitor geometry that a picker built on it could actually act on, so we don't
# build one — an in-app picker that can't change what gets captured would be actively misleading.

# FFI-adjacent (borrowed-surface pointer): relax the workspace unsafe deny here (CONTRIBUTING §5).
[lints.rust]
unsafe_code = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
