<!doctype html>
<!--
  Casual Annotate — the sharer's overlay page.

  Everything here must composite over the desktop. A background colour anywhere in this document is
  a white screen on the shared display, which is precisely the ADR-100 regression: the overlay must
  be transparent and click-through, always.
-->
<html>
<head>
    <meta charset="utf-8">
    <title>Annotations</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Transparent, and non-interactive even if the window flags were ever wrong. */
            background: transparent;
            pointer-events: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="annotate-overlay"></canvas>
    <script type="module" src="./overlay-page.js"></script>
</body>
</html>
