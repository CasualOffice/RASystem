name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt / clippy / test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # nasm builds OpenH264's x86 assembly (ras-media-openh264) on x86 runners; a no-op on arm macOS.
      - uses: ilammy/setup-nasm@v1
      # Linux system deps: ras-media-scap PipeWire capture (pipewire + dbus + libclang),
      # ras-audio-linux system-audio capture (libpulse — PulseAudio/PipeWire-pulse monitor source),
      # and ras-mic microphone capture (libasound2-dev — cpal's ALSA backend on Linux).
      - name: Linux capture deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libpulse-dev libdbus-1-dev libclang-dev pkg-config libvpx-dev libasound2-dev
      # macOS libvpx: the unified app now links ras-media-vpx on macOS too (codec negotiation — a macOS
      # host can encode VP9 for WebKitGTK viewers that can't decode our H.264). The app builds in
      # release.yml, but install libvpx here as well so the ras-media-vpx build/test step below is
      # exercised on macOS (pkg-config finds Brew's libvpx).
      - name: macOS VPX dep
        if: matrix.os == 'macos-latest'
        run: brew install libvpx pkg-config
      # Windows linker-flakiness mitigation. `cargo test --all` links every crate's examples, incl. the
      # OS-native `pointer_roundtrip` (a trivial stub on Windows). The MSVC linker intermittently hits
      # `LNK1104: cannot open file …exe` because Windows Defender briefly holds the freshly-written
      # output binary — a well-known GitHub-Windows-runner flake, not a code fault (it recurred on
      # unrelated commits and always passed on re-run). Exclude the target dir from real-time scanning
      # and disable incremental (fewer intermediate files to contend on). Coverage-neutral; non-fatal so
      # it can never itself break the job.
      - name: Windows linker-flakiness mitigation
        if: matrix.os == 'windows-latest'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target" -ErrorAction SilentlyContinue
          echo "CARGO_INCREMENTAL=0" >> $env:GITHUB_ENV
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        if: matrix.os != 'windows-latest'
        run: cargo test --all
      # Windows: retry to ride out the transient `LNK1104: cannot open file …exe` Defender file-lock
      # flake (see the mitigation step above). A genuine test failure fails all attempts, so this never
      # hides a real regression; it only absorbs the well-known runner flake that always clears on re-run.
      - name: test (windows, retry linker flake)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ok = $false
          foreach ($attempt in 1..3) {
            Write-Host "cargo test --all (attempt $attempt)"
            cargo test --all
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "attempt $attempt failed (exit $LASTEXITCODE) - waiting for the Defender file-lock to settle, then retrying"
            Start-Sleep -Seconds 12
          }
          if (-not $ok) { exit 1 }
      # ras-media-vpx links system libvpx and is excluded from the workspace, so build + test it on its
      # own manifest, incl. fmt/clippy so it stays gated. It is now used on BOTH Linux (the VP9 host
      # encode path) AND macOS (codec negotiation — VP9 for WebKitGTK viewers), so exercise it on each
      # (both have libvpx installed above). Windows has no libvpx (Inv 18), so it is skipped there.
      - name: ras-media-vpx (VP9/VP8 encoder)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          cargo fmt --manifest-path crates/ras-media-vpx/Cargo.toml -- --check
          cargo clippy --manifest-path crates/ras-media-vpx/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/ras-media-vpx/Cargo.toml
      # ras-camera (call camera capture) is excluded from the workspace so its heavy cross-platform
      # dep (nokhwa) can't break the main build. The pure conversion/adapter core (default features)
      # is verified on ubuntu + macOS; the nokhwa backend (`--features capture`, AVFoundation) is
      # compile-checked on macOS only (its Linux V4L2 / Windows MediaFoundation builds are the
      # on-device follow-up). fmt/clippy/test on its own manifest so it stays gated.
      - name: ras-camera (call camera — pure core)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          cargo fmt --manifest-path crates/ras-camera/Cargo.toml -- --check
          cargo clippy --manifest-path crates/ras-camera/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/ras-camera/Cargo.toml
      - name: ras-camera (nokhwa backend compile-check)
        if: matrix.os == 'macos-latest'
        run: cargo clippy --manifest-path crates/ras-camera/Cargo.toml --all-targets --features capture -- -D warnings
      - name: bench (hot-path smoke + sanity ceiling)
        # Not a precise perf gate — runs the hand-rolled micro-benchmarks so a gross regression
        # (hang / O(n²) / alloc storm) trips the loose per-op sanity ceiling. Prints ns/op baselines.
        run: cargo bench -p ras-core --bench hot_paths

  deny:
    name: license & advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: workspace
        uses: EmbarkStudios/cargo-deny-action@v2
      # app/src-tauri is a separate manifest outside the root workspace (Tauri v2, heavy WebView deps
      # kept out of the main build per CLAUDE.md §7) — it was never actually checked here before
      # (discovered 2026-07-24). Same deny.toml policy, pointed at the app's own Cargo.lock.
      - name: app
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/src-tauri/Cargo.toml
